name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Forge is developed on Linux and increasingly run on Windows. Testing only
    # on Linux let a whole class of defects through unnoticed: leaked file
    # handles that Linux tolerates and Windows does not, a persistent shell that
    # silently resolved to WSL bash and worked in a different filesystem
    # namespace, POSIX-only subprocess flags, and hardcoded /tmp paths.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check the package still installs
        run: python -m pip install -e .

      - name: Run unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py" -q
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Verify syntax
        run: python -m compileall -q .

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
